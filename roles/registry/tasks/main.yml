---
- name: Validate registry and TLS settings
  ansible.builtin.assert:
    that:
      - not (registry_tls_enabled | bool) or (registry_cert_path != 'CHANGEME' and registry_key_path != 'CHANGEME')

- name: Check the registry TLS certificate
  ansible.builtin.stat:
    path: "{{ registry_cert_path }}"
  register: registry_certificate
  when: registry_tls_enabled | bool

- name: Check the registry TLS private key
  ansible.builtin.stat:
    path: "{{ registry_key_path }}"
  register: registry_private_key
  when: registry_tls_enabled | bool

- name: Require registry TLS files
  ansible.builtin.assert:
    that:
      - registry_certificate.stat.exists
      - registry_private_key.stat.exists
    fail_msg: "Install the registry TLS certificate and private key before deployment."
  when: registry_tls_enabled | bool

- name: Install Podman
  ansible.builtin.package:
    name: podman
    state: present

- name: Create persistent registry storage
  ansible.builtin.file:
    path: "{{ registry_data_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"

- name: Install the Registry v2 systemd unit
  ansible.builtin.template:
    src: registry.service.j2
    dest: "/etc/systemd/system/{{ registry_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the registry

- name: Enable the registry
  ansible.builtin.systemd:
    name: "{{ registry_name }}"
    daemon_reload: true
    enabled: true
    state: started

- name: Open the registry port
  ansible.posix.firewalld:
    port: "{{ registry_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: registry_firewall_enabled | bool
