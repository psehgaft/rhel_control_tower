---
- name: Install Podman
  ansible.builtin.package:
    name: "{{ podman_packages }}"
    state: present

- name: Configure additional registries
  ansible.builtin.copy:
    dest: /etc/containers/registries.conf.d/99-local.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      unqualified-search-registries = ["registry.access.redhat.com", "docker.io"]
      {% for registry in podman_registries_conf %}
      [[registry]]
      location = "{{ registry.location }}"
      insecure = {{ registry.insecure | default(false) | lower }}
      {% endfor %}
  when: podman_registries_conf | length > 0
