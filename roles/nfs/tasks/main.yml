---
- name: Install NFS utilities
  ansible.builtin.package:
    name: "{{ nfs_packages }}"
    state: present

- name: Create exported directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ nfs_exports }}"

- name: Configure NFS exports
  ansible.builtin.lineinfile:
    path: /etc/exports
    regexp: "^{{ item.path | regex_escape }}\\s"
    line: "{{ item.path }} {{ item.clients }}({{ item.options }})"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nfs_exports }}"
  notify: Apply NFS exports

- name: Enable NFS
  ansible.builtin.service:
    name: nfs-server
    state: started
    enabled: true

- name: Open NFS services in firewalld
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: [nfs, mountd, rpc-bind]
  when: nfs_firewall_enabled | bool
