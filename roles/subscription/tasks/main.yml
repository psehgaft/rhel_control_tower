---
- name: Validate RHSM credentials
  ansible.builtin.assert:
    that:
      - rhsm_username != 'CHANGEME' or (rhsm_org_id != 'CHANGEME' and rhsm_activationkey != 'CHANGEME')
    fail_msg: "Set RHSM credentials or an organization ID and activation key."

- name: Register the system with RHSM
  community.general.redhat_subscription:
    state: present
    username: "{{ rhsm_username if rhsm_username != 'CHANGEME' else omit }}"
    password: "{{ rhsm_password if rhsm_password != 'CHANGEME' else omit }}"
    org_id: "{{ rhsm_org_id if rhsm_org_id != 'CHANGEME' else omit }}"
    activationkey: "{{ rhsm_activationkey if rhsm_activationkey != 'CHANGEME' else omit }}"
  no_log: true

- name: Enable the declared RHSM repositories
  community.general.rhsm_repository:
    name: "{{ item }}"
    state: enabled
  loop: "{{ rhsm_repositories }}"
