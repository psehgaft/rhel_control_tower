---
- name: Create IdM DNS zones
  freeipa.ansible_freeipa.ipadnszone:
    ipaadmin_password: "{{ idm_admin_password }}"
    zone_name: "{{ item }}"
    state: present
  loop: "{{ idm_dns_zones }}"
  no_log: true

- name: Create DNS A records
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ idm_admin_password }}"
    zone_name: "{{ item.zone | default(idm_domain) }}"
    name: "{{ item.name }}"
    record_type: A
    record_value: "{{ item.ip }}"
    state: present
  loop: "{{ idm_dns_records }}"
  no_log: true
